<div class="campos">
  <div><label>Descrição</label><input name="descricao" value="{{ p.descricao if p else '' }}" required placeholder="Ex.: Lava louça"></div>
  <div><label>Cartão/conta</label><select name="conta_id">
    {% for c in cartoes %}<option value="{{ c.id }}" {{ 'selected' if p and c.id == p.conta_id }}>{{ c.nome }}{{ '' if c.eh_cartao else ' (conta)' }}</option>{% endfor %}
  </select></div>
  <div><label>Valor</label><input name="valor" value="{{ (p.valor_total|entrada) if p else '' }}" required placeholder="1951,30" autocomplete="off"></div>
  <div><label>O valor é</label><select name="tipo_valor">
    <option value="total">Total da compra</option>
    <option value="parcela">De cada parcela</option>
  </select></div>
  <div><label>Nº de parcelas</label><input type="number" name="parcelas" min="1" max="120" value="{{ p.parcelas if p else 10 }}" required></div>
  <div><label>Mês de referência</label><input type="month" name="mes" value="{{ ((p.primeira + p.lancada_desde - 1) if p else comp_hoje)|mes_input }}" required></div>
  <div><label>Parcela nesse mês</label><input type="number" name="parcela_no_mes" min="1" value="{{ p.lancada_desde if p else 1 }}" required>
    <div class="ajuda">Para compras já em andamento: ex. “5” se em {{ nome_comp(comp_hoje, True) }} cai a 5/10.</div></div>
</div>
{% if verbas %}
<fieldset>
  <legend>Verba (opcional)</legend>
  <div class="campos">
    <div><label>Descontar da verba</label><select name="verba_id">
      <option value="">Nenhuma</option>
      {% for v in verbas %}<option value="{{ v.id }}" {{ 'selected' if p and v.id == p.verba_id }}>{{ v.descricao }}</option>{% endfor %}
    </select></div>
    <div><label>Valor aplicado na verba (por parcela)</label>
      <input name="verba_valor" value="{{ (p.verba_expr or (p.verba_valor|entrada if p.verba_valor is not none else '')) if p and p.verba_id else '' }}" placeholder="195,13" autocomplete="off">
      <div class="ajuda">Preenchido com o valor da parcela de sinal invertido ao escolher a verba. Pode editar.</div></div>
  </div>
</fieldset>
<script>
(() => {
  const form = document.currentScript.closest("form");
  const campo = (n) => form.querySelector(`[name="${n}"]`);
  const valor = campo("valor"), tipo = campo("tipo_valor"), parcelas = campo("parcelas");
  const verba = campo("verba_id"), destino = campo("verba_valor");

  function preencher() {
    if (!verba.value) return;
    const v = cf.avaliar(valor.value), n = parseInt(parcelas.value, 10);
    if (v === null || !(n > 0)) return;
    // Compra é sempre saída; a parcela invertida é o que sai da verba.
    const parcela = tipo.value === "parcela" ? Math.abs(v) : Math.abs(v) / n;
    destino.value = cf.formatar(parcela);
  }

  verba.addEventListener("change", () => { if (verba.value) preencher(); else destino.value = ""; });
  valor.addEventListener("input", preencher);
  tipo.addEventListener("change", preencher);
  parcelas.addEventListener("input", preencher);
})();
</script>
{% endif %}
