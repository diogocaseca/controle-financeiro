[project]
name = "controle-financeiro"
version = "0.1.0"
description = "Controle financeiro pessoal (substitui a planilha Despesas)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.scripts]
controle-financeiro = "controle_financeiro.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controle_financeiro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
